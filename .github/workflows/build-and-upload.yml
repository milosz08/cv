name: Build and upload to GCS (multi languages)

on:
  push:
    branches:
      - master
    paths:
      - "**.tex"
      - "ci_**"
      - ".github/workflows/build-and-upload.yml"

env:
  USER_NAME: "miloszgilga"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        run: |
          chmod +x ci_compile.sh ci_build.sh
          ./ci_build.sh

      - name: Create PDF files directory
        run: |
          mkdir -p output_cv

      - name: Rename PDF files
        run: |
          mv cv_pl.pdf "output_cv/cv_${{ env.USER_NAME }}_pl.pdf"
          mv cv_en.pdf "output_cv/cv_${{ env.USER_NAME }}_en.pdf"

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Upload to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: "output_cv"
          destination: ${{ secrets.GCS_BUCKET_NAME }}
          parent: false
