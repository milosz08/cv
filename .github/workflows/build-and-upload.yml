name: Build and upload to GCS (multi languages)

on:
  push:
    branches:
      - master
    paths:
      - '**.tex'
      - '.github/workflows/build-and-upload.yml'

env:
  USER_NAME: "miloszgilga"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX in minimal Docker container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace debian:bookworm-slim bash -c "
            apt-get update && apt-get install -y --no-install-recommends \
              texlive-luatex \
              texlive-latex-recommended \
              texlive-latex-extra \
              texlive-fonts-recommended \
              texlive-lang-polish \
              texlive-lang-english \
              latexmk \
              ca-certificates && \
            latexmk -pdf -interaction=nonstopmode -halt-on-error cv_pl.tex && \
            latexmk -pdf -interaction=nonstopmode -halt-on-error cv_en.tex
          "

      - name: Rename PDF files
        run: |
          mv cv_pl.pdf "cv_${{ env.USER_NAME }}_pl.pdf"
          mv cv_en.pdf "cv_${{ env.USER_NAME }}_en.pdf"

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Upload to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: "cv_${{ env.USER_NAME }}_*.pdf"
          destination: ${{ secrets.GCS_BUCKET_NAME }}
          parent: false
          gzip: false
